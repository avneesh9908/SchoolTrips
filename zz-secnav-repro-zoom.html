<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{ --accent:#2b3a8f; --line:#e9ecf3; --muted:#5b6474; --navy:#1b2560;
  --shell-w:100%; --shell-pad:30px; --header-h:66px; }
*{box-sizing:border-box}
body{margin:0;background:#fafbfd;font-family:system-ui,sans-serif}

button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 8px;
}

.secnav {
  position: sticky; top: var(--header-h); z-index: 40;
  margin: 26px calc(-1 * var(--shell-pad)) 0;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.secnav-inner {
  max-width: var(--shell-w); margin: 0 auto; padding: 0 var(--shell-pad);
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
}
.secnav-inner::-webkit-scrollbar { display: none; }
.secnav button {
  flex: 0 0 auto; padding: 15px 14px; border: none; background: transparent;
  font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: color .18s ease, border-color .18s ease;
}
.secnav button:hover { color: var(--navy); }
.secnav button.is-active { color: var(--navy); border-bottom-color: var(--accent); }
.wrap{padding:0 30px; zoom:5}
</style></head><body>
<div class="wrap">
<nav class="secnav">
  <div class="secnav-inner" role="tablist" aria-label="Trip sections">
    <button id="t1" role="tab" aria-selected="true" tabindex="0" class="is-active">Overview</button>
    <button id="t2" role="tab" aria-selected="false" tabindex="-1">Itinerary</button>
    <button id="t3" role="tab" aria-selected="false" tabindex="-1">Packing list</button>
    <button id="t4" role="tab" aria-selected="false" tabindex="-1">Documents</button>
  </div>
</nav>
</div>
<div style="height:400px"></div>
<script>
window.__m = function(){
  const inner=document.querySelector('.secnav-inner');
  const b=document.getElementById('t1');
  const cs=getComputedStyle(inner);
  const ir=inner.getBoundingClientRect(), br=b.getBoundingClientRect();
  return {
    overflowX: cs.overflowX, overflowY: cs.overflowY,
    innerPadTop: cs.paddingTop, innerPadBottom: cs.paddingBottom,
    innerHeight: ir.height, btnHeight: br.height,
    innerTop: ir.top, btnTop: br.top,
    innerBottom: ir.bottom, btnBottom: br.bottom,
    scrollHeight: inner.scrollHeight, clientHeight: inner.clientHeight,
    gapTop: br.top - ir.top, gapBottom: ir.bottom - br.bottom
  };
};
</script>
</body></html>
