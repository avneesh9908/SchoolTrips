<svg viewBox="0 0 680 580" width="680" height="580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>How data travels from the Google Sheet to a parent's screen</title>
<desc>A single Google Sheet with eight tabs is read by an adapter chosen by config.json, normalized into a consistent shape, filtered by a grade gate that blocks other grades, and rendered as the trip page.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#767066"/>
</marker>
</defs>

<rect x="220" y="20" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="370" y="42" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0C447C">Google Sheet · 8 tabs</text>
<text x="370" y="61" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">one permanent spreadsheet</text>

<line x1="370" y1="84" x2="370" y2="128" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="136" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="370" y="158" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0C447C">Adapter</text>
<text x="370" y="177" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">mock · sheets · api</text>

<rect x="30" y="136" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#ECE6D6"/>
<text x="105" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#22303F">config.json</text>
<text x="105" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#767066">picks the source</text>

<line x1="188" y1="164" x2="212" y2="164" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="200" x2="370" y2="244" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="252" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="370" y="274" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0C447C">Normalize and assemble</text>
<text x="370" y="293" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">tolerates messy headers</text>

<line x1="370" y1="316" x2="370" y2="360" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="368" width="300" height="56" rx="10" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="370" y="390" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#854F0B">Grade gate</text>
<text x="370" y="409" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#BA7517">other grades never fetched</text>

<line x1="370" y1="432" x2="370" y2="476" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="484" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="370" y="506" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0C447C">Trip page</text>
<text x="370" y="525" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">what the parent sees</text>
</svg>
