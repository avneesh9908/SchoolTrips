<svg viewBox="0 0 680 410" width="680" height="410" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>How a parent is restricted to their own child's grade</title>
<desc>A parent enters an email or mobile number, matched against the Students sheet. The session is pinned to the grades of the matched children. Their own child's grade loads the trip; any other grade is blocked before any data is fetched.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#767066"/>
</marker>
</defs>

<rect x="180" y="20" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#ECE6D6"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#22303F">Parent enters email or mobile</text>
<text x="340" y="61" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#767066">no verification unless Google is on</text>

<line x1="340" y1="84" x2="340" y2="112" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="120" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#ECE6D6"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#22303F">Matched in Students sheet</text>
<text x="340" y="161" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#767066">row must carry that email or phone</text>

<line x1="340" y1="184" x2="340" y2="212" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="220" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#ECE6D6"/>
<text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#22303F">Session pinned to those grades</text>
<text x="340" y="261" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#767066">never read from the URL</text>

<path d="M 340 284 L 340 306 L 175 306 L 175 320" fill="none" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 340 284 L 340 306 L 505 306 L 505 320" fill="none" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="328" width="270" height="56" rx="10" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="175" y="350" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0F6E56">Own child's grade</text>
<text x="175" y="369" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#1D9E75">trip loads</text>

<rect x="370" y="328" width="270" height="56" rx="10" fill="#FCEBEB" stroke="#F09595"/>
<text x="505" y="350" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#A32D2D">Any other grade</text>
<text x="505" y="369" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#E24B4A">blocked before any fetch</text>
</svg>
