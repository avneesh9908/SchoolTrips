<svg viewBox="0 0 680 430" width="680" height="430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>One Drive folder, one master sheet, one link into the code</title>
<desc>The code holds a single link in public/config.json. That link points at the Trip Master spreadsheet, whose Settings tab links to the individual source spreadsheets. The Documents sheet in turn links to the per-grade document folders.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#767066"/>
</marker>
</defs>

<rect x="240" y="20" width="420" height="390" rx="22" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="264" y="46" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#2C2C2A">Drive folder · School Trips</text>

<rect x="20" y="180" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#ECE6D6"/>
<text x="110" y="203" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#22303F">Your code</text>
<text x="110" y="223" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-family="ui-monospace, Consolas, monospace" fill="#767066">config.json → sheetId</text>

<line x1="208" y1="212" x2="232" y2="212" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="70" width="360" height="62" rx="10" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="450" y="93" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#854F0B">Trip Master</text>
<text x="450" y="114" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#BA7517">Settings tab holds every link</text>

<line x1="450" y1="140" x2="450" y2="170" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="178" width="360" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="450" y="200" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#0C447C">Students · Trips · Itinerary · Documents</text>
<text x="450" y="222" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#0C447C">Guidelines · Reminders · Travel · Media</text>
<text x="450" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">one spreadsheet each, or tabs in the master</text>

<line x1="450" y1="262" x2="450" y2="292" stroke="#767066" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="300" width="360" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="450" y="322" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#0C447C">Grade 7 · Grade 9 · Grade 5 folders</text>
<text x="450" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">decks, posters, photos</text>
<text x="450" y="363" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">linked from the Documents sheet</text>
</svg>
